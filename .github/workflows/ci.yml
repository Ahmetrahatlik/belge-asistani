name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Retrieval evaluation (hit@3 must stay at 75% or more)
        run: python degerlendirme.py
        env:
          PYTHONIOENCODING: utf-8
